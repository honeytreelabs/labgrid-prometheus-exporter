[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labgrid-toolkit-backend-grpc"
version = "0.1.0"
description = "labgrid toolkit backend for labgrid's gRPC coordinator protocol (labgrid >= 25.0)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "labgrid-toolkit-core",
    # No upper bound: labgrid's gRPC proto has been unchanged since it was
    # introduced in 25.0. Add a cap here only once a future labgrid release
    # is actually confirmed to break it.
    "labgrid>=25.0",
]

[tool.uv.sources]
labgrid-toolkit-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "ty>=0.0.67",
]

[tool.hatch.build.targets.wheel]
packages = ["src/labgrid_toolkit_backend_grpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# see root pyproject.toml's addopts comment
addopts = "-q -p no:labgrid"
