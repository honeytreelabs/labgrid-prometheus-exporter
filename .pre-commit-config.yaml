---
repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format check
        entry: uv run --no-sync ruff format --check
        language: system
        types_or: [python, pyi]
        pass_filenames: true

      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check
        language: system
        types_or: [python, pyi]
        pass_filenames: true

      - id: pytest
        name: pytest
        # grpc and wamp backends conflict (see [tool.uv] conflicts in the
        # root pyproject.toml), so there's no single `uv run` that covers
        # both; delegate to the Makefile's per-variant loop instead.
        entry: make test
        language: system
        pass_filenames: false

      - id: ty-check
        name: ty check
        entry: make type-check
        language: system
        pass_filenames: false
