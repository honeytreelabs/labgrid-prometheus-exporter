[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labgrid-prometheus-exporter"
version = "0.1.0"
description = "Labgrid Framework Prometheus Exporter"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "labgrid>=24.0",
]

[project.scripts]
labgrid-prometheus-exporter = "labgrid_prometheus_exporter.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "ty>=0.0.67",
]

[tool.hatch.build.targets.wheel]
packages = ["src/labgrid_prometheus_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
