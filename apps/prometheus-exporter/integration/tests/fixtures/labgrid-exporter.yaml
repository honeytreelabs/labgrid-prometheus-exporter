## Resource config for a real labgrid exporter container (see the
## labgrid-exporter service in apps/prometheus-exporter/docker/compose.grpc.yml/apps/prometheus-exporter/docker/compose.wamp.yml),
## used to prove labgrid_resource_available against a real labgrid exporter
## process.
##
## NetworkService is a plain labgrid.resource.common.Resource whose exporter
## wrapper (NetworkServiceExport) never overrides _start/_stop -- avail goes
## true the moment the labgrid exporter registers it with the coordinator,
## regardless of whether anything is listening at address:port. This is
## labgrid's own reference choice for exactly this scenario
## (dockerfiles/staging/exporter-conf/exporter.yaml), and deliberately means
## no dut container is needed here.
##
## Note: this file is rendered through Jinja2 before being parsed as YAML
## (labgrid.remote.config.ResourceConfig), with line_statement_prefix="#"
## and line_comment_prefix="##" -- a single '#' here is a Jinja2 *statement*,
## not a comment, unlike places.yaml (loaded as plain YAML, no templating).
integration-test-group:
  NetworkService:
    address: 127.0.0.1
    port: 65535
    username: root
