[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labgrid-prometheus-exporter"
version = "0.1.0"
description = "Prometheus exporter for labgrid. Install with the extra matching your coordinator's labgrid version, e.g. labgrid-prometheus-exporter[grpc]."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
    "labgrid-toolkit-core",
]

[project.optional-dependencies]
grpc = ["labgrid-toolkit-backend-grpc"]
wamp = ["labgrid-toolkit-backend-wamp"]

[project.scripts]
labgrid-prometheus-exporter = "labgrid_prometheus_exporter.cli:main"

[tool.uv.sources]
labgrid-toolkit-core = { workspace = true }
labgrid-toolkit-backend-grpc = { workspace = true }
labgrid-toolkit-backend-wamp = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "ty>=0.0.67",
]

[tool.hatch.build.targets.wheel]
packages = ["src/labgrid_prometheus_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# see root pyproject.toml's addopts comment
addopts = "-q -p no:labgrid"
