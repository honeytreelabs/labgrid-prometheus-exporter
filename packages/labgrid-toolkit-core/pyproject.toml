[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labgrid-toolkit-core"
version = "0.1.0"
description = "Shared labgrid toolkit logic for metrics, HTTP serving, and backend contracts"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "prometheus-client>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "ty>=0.0.67",
]

[tool.hatch.build.targets.wheel]
packages = ["src/labgrid_toolkit_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# see root pyproject.toml's addopts comment
addopts = "-q -p no:labgrid"
