[tool.uv.workspace]
members = ["packages/*", "apps/prometheus-exporter"]

[dependency-groups]
# httpx is only used by apps/prometheus-exporter/integration/tests
# (scraping the exporter's HTTP endpoint); kept here rather than in a
# package's own dev group since it isn't specific to the reusable toolkit
# packages or the Prometheus exporter app package.
dev = ["pre-commit>=4.6.1", "httpx>=0.27"]

[tool.uv]
# package-level `conflicts` (as opposed to conflicting extras of one
# project) is still preview/experimental in uv; this silences the warning
# uv prints on every invocation rather than working around it per-command.
preview-features = ["package-conflicts"]
conflicts = [
    [
        { package = "labgrid-toolkit-backend-grpc" },
        { package = "labgrid-toolkit-backend-wamp" },
    ],
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["packages", "apps/prometheus-exporter/tests"]
# labgrid ships a pytest11 plugin that pytest autoloads whenever labgrid is
# installed, regardless of whether it's used. Importing it imports
# labgrid.remote.client, which on labgrid < 25.0 (the wamp backend) runs
# `txaio.config.loop = asyncio.get_event_loop()` at module import time --
# broken on Python >= 3.14, where that raises without a running loop. We
# don't use labgrid's pytest fixtures, so just disable autoloading it.
addopts = "-q -p no:labgrid"
