[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labgrid-toolkit-backend-wamp"
version = "0.1.0"
description = "labgrid toolkit backend for labgrid's WAMP coordinator protocol (labgrid < 25.0)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "labgrid-toolkit-core",
    "autobahn>=21.3.1",
    # Upper bound is deliberate here, unlike backend-grpc's: labgrid 25.0 is a
    # confirmed hard, backwards-incompatible break away from this protocol
    # (see CHANGES.rst), not a speculative guess.
    "labgrid>=24.0,<25.0",
]

[tool.uv.sources]
labgrid-toolkit-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "ty>=0.0.67",
]

[tool.hatch.build.targets.wheel]
packages = ["src/labgrid_toolkit_backend_wamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# see root pyproject.toml's addopts comment
addopts = "-q -p no:labgrid"
