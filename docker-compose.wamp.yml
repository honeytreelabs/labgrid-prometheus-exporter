# Coordinator + exporter stack for the WAMP backend (labgrid < 25.0).
# Not used by `make test` -- see `make test-integration`.
#
# Explicit project name: see docker-compose.grpc.yml for why.
name: labgrid-prometheus-exporter-integration-wamp
services:
  coordinator:
    build:
      # See docker-compose.grpc.yml for why this builds from source rather
      # than pulling a published image.
      context: "https://github.com/labgrid-project/labgrid.git#v24.0.3"
      dockerfile: dockerfiles/Dockerfile
      target: labgrid-coordinator
      args:
        VERSION: "24.0.3"
    volumes:
      - "./tests/integration/fixtures:/home/root/fixtures:ro"
    # No fixed host port: see docker-compose.grpc.yml for why.
    ports:
      - "20408"
    # Same reasoning as the gRPC compose file's coordinator: copy the
    # fixture into place (here, crossbar's state dir) rather than
    # bind-mounting it directly, since it's written back to as state
    # changes. The image's default CMD already starts crossbar; we just
    # need the copy step first.
    #
    # The pip3 install is a workaround, not something we'd want long-term:
    # crossbar imports pkg_resources, which setuptools >= 82.0.0 no longer
    # includes at all (removed, not just deprecated -- see
    # https://github.com/pypa/setuptools/issues/5174). labgrid's Dockerfile
    # installs whatever setuptools version is current at build time with no
    # upper bound, so a build today pulls one that's missing pkg_resources
    # and crossbar fails at startup with "ModuleNotFoundError: No module
    # named 'pkg_resources'". Not something we can fix without patching
    # labgrid's Dockerfile, so pin an older setuptools into the already-built
    # venv at container start instead.
    command: >
      bash -c "cp /home/root/fixtures/places.yaml /opt/crossbar/places.yaml &&
      /opt/labgrid/crossbar-venv/bin/pip3 install --no-cache-dir 'setuptools<82' &&
      /opt/labgrid/crossbar-venv/bin/crossbar start --config /opt/labgrid/.crossbar/config-anonymous.yaml"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/20408'"]
      interval: 2s
      timeout: 2s
      retries: 30

  exporter:
    build:
      context: .
      args:
        BACKEND: wamp
    command: ["--crossbar", "ws://coordinator:20408/ws", "--poll-interval", "1"]
    ports:
      - "9314"
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9314/metrics', timeout=2)",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
